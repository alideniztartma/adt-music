name: Masaüstü derle (Windows + Linux)

on:
  push:
    branches: [ main, master, masaustu ]
    paths: [ 'desktop/**', '.github/workflows/desktop.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            tasks: packageMsi packageExe createDistributable
          - os: ubuntu-latest
            name: linux
            tasks: packageDeb packageRpm createDistributable
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Windows: ses motoru (VLC) uygulamayla birlikte gelir, ayrıca kurmak gerekmez.
      - name: VLC'yi indir (Windows)
        if: matrix.name == 'windows'
        run: |
          VLC=3.0.21
          curl -fsSL -o vlc.zip "https://download.videolan.org/pub/videolan/vlc/$VLC/win64/vlc-$VLC-win64.zip"
          unzip -q vlc.zip
          mkdir -p app-resources/windows/vlc
          cp vlc-$VLC/libvlc.dll vlc-$VLC/libvlccore.dll app-resources/windows/vlc/
          cp -r vlc-$VLC/plugins app-resources/windows/vlc/
          # Yalnızca ses için gerekenler kalsın (paket küçülsün)
          cd app-resources/windows/vlc/plugins
          rm -rf gui video_output video_filter video_splitter video_chroma visualization spu text_renderer \
                 lua control stream_out meta_engine services_discovery keystore
          rm -f plugins.dat
          du -sh ..

      - name: rpm aracı (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Derle ve paketle
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.tasks }} --stacktrace

      - name: Taşınabilir arşiv
        run: |
          cd build/compose/binaries/main/app
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a -tzip "../ADT-Music-${{ github.run_number }}-windows-portable.zip" "ADT Music" > /dev/null
          else
            tar -czf "../ADT-Music-${{ github.run_number }}-linux-x64.tar.gz" "ADT Music"
          fi

      - name: Dosyaları topla
        run: |
          mkdir -p ../dist
          find build/compose/binaries/main -not -path "*/app/*" \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*-portable.zip" -o -name "*-linux-x64.tar.gz" \) -exec cp {} ../dist/ \;
          ls -lh ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: ADT-Music-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Masaüstü sürümünü yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: ADT Music masaüstü ${{ github.run_number }}
          # Android'in uygulama içi güncellemesi "latest" sürüme bakar; masaüstü onu ezmesin.
          make_latest: false
          files: dist/*
          body: |
            **Windows:** `.msi` (önerilen) ya da `.exe` kurulum dosyasını indir. Kurulum gerekmesin istersen `windows-portable.zip`.
            **Linux (Debian/Ubuntu/Mint):** `.deb` → `sudo apt install ./adt-music_*.deb` · **Fedora/openSUSE:** `.rpm`
            Linux'ta ses için VLC gerekir: `sudo apt install vlc` (Windows paketinde VLC hazır gelir).

            ${{ github.event.head_commit.message }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
