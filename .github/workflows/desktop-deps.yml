name: Masaüstü bağımlılık önbelleği (geçici)

on:
  push:
    branches: [ masaustu ]
    paths: [ 'desktop/build.gradle.kts', '.github/workflows/desktop-deps.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Bağımlılıkları çöz
        working-directory: desktop
        run: |
          chmod +x gradlew
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/resolve.gradle <<'G'
          allprojects {
            tasks.register("resolveAll") {
              doLast {
                configurations.findAll { it.canBeResolved }.each { c ->
                  try { c.resolve(); println("OK " + c.name) } catch (e) { println("FAIL " + c.name + ": " + e.message) }
                }
              }
            }
          }
          G
          ./gradlew resolveAll --no-daemon
      - name: Önbelleği paketle ve yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -C ~/.gradle/caches -czf deps.tgz modules-2
          ls -lh deps.tgz
          gh release delete desktop-deps -y --cleanup-tag || true
          gh release create desktop-deps deps.tgz --prerelease --title "geçici: masaüstü bağımlılık önbelleği" --notes "Geçici; silinecek." --target masaustu
