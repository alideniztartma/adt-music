<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460">
  <style>
    .t{font-family:'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900}
    .s{font-family:'Helvetica Neue',Arial,sans-serif}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:eq 1.2s ease-in-out infinite alternate}
    .b1{animation-duration:.9s}.b2{animation-duration:1.3s;animation-delay:-.4s}.b3{animation-duration:.7s;animation-delay:-.2s}
    .b4{animation-duration:1.1s;animation-delay:-.7s}.b5{animation-duration:.8s;animation-delay:-.5s}.b6{animation-duration:1.4s;animation-delay:-.1s}
    @keyframes eq{0%{transform:scaleY(.18)}50%{transform:scaleY(.75)}100%{transform:scaleY(1)}}
    .disc{transform-origin:1040px 230px;animation:spin 9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .acc{animation:hue 16s steps(1) infinite}
    @keyframes hue{0%{fill:#FF5A1F}12.5%{fill:#E5383B}25%{fill:#FF4D8D}37.5%{fill:#8A5CFF}50%{fill:#2F6BFF}62.5%{fill:#00A6A6}75%{fill:#18B36B}87.5%{fill:#FFB400}}
  </style>
  <rect width="1280" height="460" fill="#111111"/>
  <!-- ince ızgara -->
  <g stroke="#F4F2EE" stroke-opacity=".05">
    <path d="M0 115H1280M0 230H1280M0 345H1280M160 0V460M320 0V460M480 0V460M640 0V460M800 0V460M960 0V460M1120 0V460"/>
  </g>

  <!-- plak -->
  <g class="disc">
    <circle cx="1040" cy="230" r="170" fill="#1b1b1b"/>
    <g fill="none" stroke="#F4F2EE" stroke-opacity=".07">
      <circle cx="1040" cy="230" r="150"/><circle cx="1040" cy="230" r="130"/><circle cx="1040" cy="230" r="110"/><circle cx="1040" cy="230" r="90"/>
    </g>
    <path d="M1040 60 A170 170 0 0 1 1180 135 L1040 230Z" fill="#F4F2EE" fill-opacity=".04"/>
    <circle cx="1040" cy="230" r="62" class="acc" fill="#FF5A1F"/>
    <!-- nota (simgeden) -->
    <g transform="translate(1040 230) scale(4.2) translate(-68 -68)" fill="#111111">
      <path d="M69.328,71.367 A3.84,2.88 -20 1,1 62.112,73.993 A3.84,2.88 -20 1,1 69.328,71.367 Z M68.12,60.44 H69.44 V72.92 H68.12 Z M69.44,60.44 C69.44,64.04 74.12,65.24 73.16,70.28 C72.68,67.4 71.24,66.2 69.44,66.2 Z"/>
    </g>
  </g>

  <!-- başlık -->
  <text x="80" y="118" class="s" font-size="20" letter-spacing="6" fill="#F4F2EE" fill-opacity=".55">ANDROID · YOUTUBE MUSIC İSTEMCİSİ</text>
  <text x="74" y="250" class="t" font-size="150" fill="#F4F2EE" letter-spacing="-4">ADT</text>
  <text x="74" y="370" class="t" font-size="150" fill="#F4F2EE" letter-spacing="-4">MUSIC<tspan class="acc" fill="#FF5A1F">.</tspan></text>

  <!-- ekolayzer -->
  <g transform="translate(450 252)">
    <rect class="bar b1 acc" x="0"  y="-90" width="16" height="90" fill="#FF5A1F"/>
    <rect class="bar b2" x="24" y="-90" width="16" height="90" fill="#F4F2EE"/>
    <rect class="bar b3 acc" x="48" y="-90" width="16" height="90" fill="#FF5A1F"/>
    <rect class="bar b4" x="72" y="-90" width="16" height="90" fill="#F4F2EE"/>
    <rect class="bar b5 acc" x="96" y="-90" width="16" height="90" fill="#FF5A1F"/>
    <rect class="bar b6" x="120" y="-90" width="16" height="90" fill="#F4F2EE"/>
  </g>

  <text x="80" y="420" class="s" font-size="24" fill="#F4F2EE" fill-opacity=".8">Müziğin, tarzın, kontrol sende.</text>
  <rect x="0" y="452" width="1280" height="8" class="acc" fill="#FF5A1F"/>
</svg>
